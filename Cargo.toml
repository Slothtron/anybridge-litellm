[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
subtle = "2"
sha2 = "0.10"

axum = { version = "0.8", features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "fs", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
bytes = "1"
futures-util = "0.3"
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"

anybridge-litellm-core = { path = "crates/core" }
anybridge-litellm-server = { path = "crates/server" }
