server:
  bind: "127.0.0.1:4000"

auth:
  master_key: os.environ/GATEWAY_MASTER_KEY

# 凭据文件：密钥值单独存放，配置文件里只留 `credential/<name>` 引用。
# 缺省路径 ~/.config/anybridge-litellm/credentials.yaml（0600）。
# credentials:
#   file: /path/to/credentials.yaml

providers:
  openai:                              # 配置键 = 路径里的 provider 段
    api: completions                   # completions | anthropic | responses
    base_url: https://api.openai.com/v1
    api_key: credential/OPENAI_API_KEY         # 值写在凭据文件里，控制台可写入/轮换
    timeout: 600
    models:
      - id: gpt-4o
        name: GPT-4o
        context_window: 128000
        max_output_tokens: 16384
        input: [text, image]
        reasoning: true
        thinking_levels: [none, low, medium, high]
  openai-responses:                    # 一个 provider 只有一种 api；要换协议就另开 provider
    api: responses
    base_url: https://api.openai.com/v1
    api_key: credential/OPENAI_API_KEY
    timeout: 600
    models:
      - id: gpt-5.6-luna
  anthropic:
    api: anthropic
    base_url: https://api.anthropic.com/v1
    api_key: credential/ANTHROPIC_API_KEY
    timeout: 600
    models:
      - id: claude-sonnet-4-20250514
      - id: claude-haiku-4-20250514
  local:
    api: completions
    base_url: http://127.0.0.1:11434/v1
    api_key: credential/LOCAL_API_KEY
    timeout: 300
    models:
      - id: qwen3:8b
  cookie-auth:                         # 通过 Cookie 鉴权的上游：不配 api_key，改由 headers 承担
    api: completions
    base_url: https://gateway.example/codeplan/v1
    headers:
      Cookie: credential/WPS_SID       # 以 credential/ 开头 → 按请求从凭据文件解析
      X-Tenant-Id: acme               # 其余按字面量发送
    timeout: 600
    models:
      - id: deepseek-v4
